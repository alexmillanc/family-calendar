spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Local default 8081; Docker/Railway override with PORT or SERVER_PORT
server.port=${PORT:${SERVER_PORT:8081}}

# Supabase / Postgres — override via env in Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Comma-separated origins (override in Railway with your frontend URL)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,http://127.0.0.1:4200}
