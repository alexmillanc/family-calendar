services:
  backend:
    build: ./backend
    container_name: family-calendar-backend
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: /api
    container_name: family-calendar-frontend
    ports:
      - "4200:80"
    volumes:
      - ./frontend/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
